paths:
  volume_root: "/workspace/crasp-vol"
  model_cache: "models"
  data_dir: "data"
  checkpoint_dir: "checkpoints"
  results_dir: "results"

model:
  name: "meta-llama/Llama-3.1-8B"
  dtype: "bfloat16"
  device: "cuda"
  device_map: "auto"
  max_seq_len: 2048

calibration:
  cot_samples: 256
  safety_samples: 256
  batch_size: 4
  activation_epsilon: 1.0e-8
  seed: 42

training:
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  learning_rate: 2.0e-4
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: "epoch"

pruning:
  target_sparsities: [0.05, 0.10, 0.15, 0.20, 0.25]
  step_fraction: 0.01
  reasoning_weight: 0.5
  safety_weight: 0.5
  clinical_retention_threshold: 0.80
  safety_retention_threshold: 0.80
  early_stop_patience: 2

eval:
  batch_size: 8
  num_samples: null
  scoring: "loglikelihood"

artifacts:
  baseline_metrics: "results/baselines/raw_meta-llama_Llama-3.1-8B_20260403T223229Z.json"
